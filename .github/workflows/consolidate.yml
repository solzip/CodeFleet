name: Repository consolidation
on:
  push:
    branches: [work/codefleet-integration]
    paths: [.github/workflows/consolidate.yml, .github/consolidate.py]
permissions:
  contents: read
concurrency:
  group: codefleet-repository-consolidation
  cancel-in-progress: false
jobs:
  merge:
    if: contains(github.event.head_commit.message, '[consolidate-20261112]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.publish.outputs.candidate }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - name: Reproduce reviewed merges and publish exact-source candidate
        id: publish
        run: python3 .github/consolidate.py merge
  alpha:
    needs: merge
    permissions:
      contents: read
    uses: ./.github/workflows/alpha.yml
    with:
      ref: ${{ needs.merge.outputs.candidate }}
  codex-cli:
    needs: merge
    permissions:
      contents: read
    uses: ./.github/workflows/codex-cli.yml
    with:
      ref: ${{ needs.merge.outputs.candidate }}
  cleanup:
    needs: [merge, alpha, codex-cli]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.merge.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: true
      - name: Archive original HEADs, fast-forward main, then remove only preserved refs
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ needs.merge.outputs.candidate }}
        run: python3 .github/consolidate.py cleanup
      - name: Preserve exact cleanup result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codefleet-consolidation-result
          path: /tmp/consolidation-result.json
          if-no-files-found: error
          retention-days: 30
