name: Alpha feedback
description: Report an alpha installation or workflow issue without private source or credentials.
title: '[alpha] '
body:
  - type: markdown
    attributes:
      value: 'Do not attach private source, state databases, tokens, account emails, or unredacted logs. Use SECURITY.md for security reports.'
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: CodeFleet revision or package version, OS, shell, Node and Host (Codex CLI or Claude Code). Include Docker and Java versions only if that verification backend was used. No account details.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
      description: Include the command type, run state, and a redacted error summary.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Outcome and effort
      description: Completion, failure, or cancellation; time spent preparing, intervening, and reviewing; any incorrect acceptance.
